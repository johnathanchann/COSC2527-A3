behaviors:
  SoccerAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 128
    max_steps: 30000000
    time_horizon: 64
    summary_freq: 5000
    keep_checkpoints: 5
    checkpoint_interval: 500000
    threaded: true
    self_play:
      save_steps: 200000
      team_change: 200000
      swap_steps: 200000
      window: 5
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200
engine_settings:
  time_scale: 20
  target_frame_rate: 60
environment_parameters:
  opponent_enabled:
    curriculum:
      - name: Lession1
        completion_criteria:
          measure: progress
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: Lession2
        completion_criteria:
          measure: progress
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.75
        value: 1.0
      - name: Lession3
        completion_criteria:
          measure: progress
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.9
        value: 1.0
  ball_start_range:
    curriculum:
      - name: Lession1
        completion_criteria:
          measure: progress
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 1.0
      - name: Lession2
        completion_criteria:
          measure: progress
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.75
        value: 3.0
      - name: Lession3
        completion_criteria:
          measure: progress
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.9
        value: 5.0