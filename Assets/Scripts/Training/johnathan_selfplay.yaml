behaviors:
  SoccerSelfPlay:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096        
      buffer_size: 40960 
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 1024       
      num_layers: 5          
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.999
        strength: 1.0
    max_steps: 5.0e9
    time_horizon: 2000       
    summary_freq: 50000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
engine_settings:
  time_scale: 10       
  target_frame_rate: 60
